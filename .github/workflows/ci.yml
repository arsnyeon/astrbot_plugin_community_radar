name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install AstrBot and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astrbot>=4.29,<5"
          python -m pip install -r requirements.txt
          python -m pip install pyflakes pyyaml

      - name: Compile all modules
        run: python -m compileall -q . -x '(__pycache__|\.git)'

      - name: Static checks
        run: |
          python -m pyflakes . || true
          python - <<'PY'
          import json, sys
          from pathlib import Path
          json.loads(Path("_conf_schema.json").read_text(encoding="utf-8"))
          print("schema JSON: ok")
          PY

      - name: Plugin spec check
        run: python scripts/check_plugin_spec.py

      - name: Config key audit
        run: python scripts/audit_config.py

      - name: Offline tests
        run: python -m unittest discover -s tests -q
